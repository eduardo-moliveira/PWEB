<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Objetos</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="container">
			<div class="card">
				<h1>Retângulo</h1>
				<form id="form-retangulo">
					<fieldset>
						<legend>Dimensões</legend>
						<div class="field">
							<label for="base">Base:</label>
							<input
								type="number"
								id="base"
								step="any"
								required
							/>
						</div>
						<div class="field">
							<label for="altura">Altura:</label>
							<input
								type="number"
								id="altura"
								step="any"
								required
							/>
						</div>
					</fieldset>
					<button type="submit">Calcular Área</button>
				</form>
				<section id="res-retangulo" aria-live="polite">...</section>
			</div>

			<div class="card">
				<h1>Conta Corrente</h1>
				<form id="form-corrente">
					<fieldset>
						<legend>Dados da Conta</legend>
						<div class="field">
							<label for="nome-corrente">Nome:</label>
							<input type="text" id="nome-corrente" required />
						</div>
						<div class="field">
							<label for="banco-corrente">Banco:</label>
							<input type="text" id="banco-corrente" required />
						</div>
						<div class="field">
							<label for="numero-corrente">Número:</label>
							<input type="text" id="numero-corrente" required />
						</div>
						<div class="field">
							<label for="saldo-corrente">Saldo:</label>
							<input
								type="number"
								id="saldo-corrente"
								step="any"
								required
							/>
						</div>
						<div class="field">
							<label for="especial-corrente"
								>Saldo Especial:</label
							>
							<input
								type="number"
								id="especial-corrente"
								step="any"
								required
							/>
						</div>
					</fieldset>
					<button type="submit">Criar Conta Corrente</button>
				</form>
				<section id="res-corrente" aria-live="polite">...</section>
			</div>

			<div class="card">
				<h1>Conta Poupança</h1>
				<form id="form-poupanca">
					<fieldset>
						<legend>Dados da Conta</legend>
						<div class="field">
							<label for="nome-poupanca">Nome:</label>
							<input type="text" id="nome-poupanca" required />
						</div>
						<div class="field">
							<label for="banco-poupanca">Banco:</label>
							<input type="text" id="banco-poupanca" required />
						</div>
						<div class="field">
							<label for="numero-poupanca">Número:</label>
							<input type="text" id="numero-poupanca" required />
						</div>
						<div class="field">
							<label for="saldo-poupanca">Saldo:</label>
							<input
								type="number"
								id="saldo-poupanca"
								step="any"
								required
							/>
						</div>
						<div class="field">
							<label for="juros-poupanca">Juros (%):</label>
							<input
								type="number"
								id="juros-poupanca"
								step="any"
								required
							/>
						</div>
						<div class="field">
							<label for="data-poupanca">Vencimento:</label>
							<input type="date" id="data-poupanca" required />
						</div>
					</fieldset>
					<button type="submit">Criar Conta Poupança</button>
				</form>
				<section id="res-poupanca" aria-live="polite">...</section>
			</div>
		</main>
		<script src="script.js"></script>
	</body>
</html>
